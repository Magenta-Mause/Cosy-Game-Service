name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Pinned deliberately — do NOT replace with ${{ github.repository }}.
          # This repository was renamed Cosy-GameApi -> Cosy-Game-Service, so
          # that context variable now resolves to `cosy-game-service`, while
          # argo/ and the live deployment run `cosy-gameapi`.
          # See Magenta-Mause/Cosy#79.
          images: ghcr.io/magenta-mause/cosy-gameapi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
