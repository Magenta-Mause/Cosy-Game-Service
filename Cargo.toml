[package]
name = "cosy-gameapi"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.14.0"
chrono = "0.4.45"
futures = "0.3.33"
reqwest = "0.12.24"
serde = { version = "1.0.229", features = ["derive"] }
